name: One-time SHA-pinned cleanup of obsolete Mimo frontend branches
on:
  push:
    branches: [main]
    paths: ['.github/workflows/one-time-branch-cleanup.yml']
permissions:
  contents: write
  pull-requests: read
jobs:
  cleanup:
    if: github.repository == 'azmath25/mimo'
    runs-on: ubuntu-latest
    steps:
      - name: Delete only unchanged ancestor branch refs
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          open_heads=$(gh api "repos/$GITHUB_REPOSITORY/pulls?state=open&per_page=100" --paginate --jq '.[].head.ref')
          failures=0
          deleted=0
          while read -r branch expected; do
            [[ -z "$branch" ]] && continue
            case "$branch" in main|main-backup|work/*) echo "PROTECTED $branch"; exit 1;; esac
            if grep -Fxq "$branch" <<< "$open_heads"; then echo "SKIP OPEN PR $branch"; continue; fi
            current=$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/$branch" --jq '.object.sha' 2>/dev/null || true)
            if [[ -z "$current" ]]; then echo "SKIP ALREADY ABSENT $branch"; continue; fi
            if [[ "$current" != "$expected" ]]; then echo "SKIP MOVED $branch"; failures=$((failures+1)); continue; fi
            ahead=$(gh api "repos/$GITHUB_REPOSITORY/compare/main...$branch" --jq '.ahead_by' 2>/dev/null || true)
            if [[ "$ahead" != "0" ]]; then echo "SKIP UNMERGED $branch (ahead=$ahead)"; failures=$((failures+1)); continue; fi
            if gh api -X DELETE "repos/$GITHUB_REPOSITORY/git/refs/heads/$branch" >/dev/null; then echo "DELETED $branch"; deleted=$((deleted+1))
            else echo "FAILED $branch"; failures=$((failures+1)); fi
          done <<'PINNED_BRANCHES'
          backup/pre-m-tex-20261105 c417aa7f783539670cf4d7f737d2346aabd2d291
          backup/pre-mimo-release-20261105 98b276d16fe5668e29fe147109dc8e0e3cf0374a
          docs/current-state-20261105 e2841db9d5ab3a9c3cc66b423e382b3f5c1c2fe6
          feature/fe-run-mode-controls-20261104 b2b1305b13657241643f510bf9aade0366219e92
          feature/m-cost-frontend-20261105 c417aa7f783539670cf4d7f737d2346aabd2d291
          feature/m-tex-package-catalog-20261105 49d77b4707ca506efeab2e30b337c7668d023c28
          feature/platform-autonomy-v1 506b2c1d9b1108cf4ca6743de291335fa4afc66e
          release/mimo-direct-production-20261104 f59533b75cb85e79344fb8ed99c5cc9767892d50
          PINNED_BRANCHES
          echo "Deleted $deleted of 8 branches; failures=$failures"
          test "$failures" -eq 0
