name: One-time cleanup of superseded Mimo branches
on:
  push:
    branches: [main]
    paths: [.github/workflows/one-time-branch-cleanup.yml]
permissions:
  contents: write
jobs:
  delete-obsolete-branches:
    if: github.repository == 'azmath25/mimo'
    runs-on: ubuntu-latest
    steps:
      - name: Delete only explicitly verified stale branch heads
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          failures=0
          while read -r branch expected_sha; do
            [[ -z "$branch" ]] && continue
            [[ "$branch" == "main" ]] && { echo "::error::Refusing to delete main"; exit 1; }
            ref_url="repos/$GITHUB_REPOSITORY/git/ref/heads/$branch"
            if ! actual_sha=$(gh api "$ref_url" --jq '.object.sha'); then
              echo "::error::Could not check $branch; leaving it unchanged"
              failures=$((failures+1))
              continue
            fi
            if [[ "$actual_sha" != "$expected_sha" ]]; then
              echo "::warning::Skipping $branch: branch has changed since inspection"
              failures=$((failures+1))
              continue
            fi
            if gh api -X DELETE "repos/$GITHUB_REPOSITORY/git/refs/heads/$branch" >/dev/null; then
              echo "Deleted $branch"
            else
              echo "::error::Could not delete $branch"
              failures=$((failures+1))
            fi
          done <<'CLEANUP_BRANCHES'
          feature/cloud-image-upload-groq-vision 0fa17f232c8808ade410d9765a08eb65e6fbb9e8
          feature/frontend-model-builder-reasoning-budget c7d4037cb379f9d9a9a73b597b522674d462b61c
          feature/mimo-v2-integrated 336e69000d634224c3efc8028cac0727cc6eb622
          feature/phase2-workflow-contract f137e8be44990c5e9e280b355b7afdd2b69e74de
          feature/real-ai-and-api-verification 80ea334ec8acfa665ec70530e35ae33b35a77a40
          feature/ui-secrets-and-tikz 9b37378987b24da35425aa8aebdd090ce4e0e16b
          fix/cloud-run-button-after-image-merge 018ba2238f88bf7fc6cf4b46b86bf00945260634
          fix/cloud-run-button-recovery b1db8e95eef682a9850dc92d6f707186224e4293
          fix/groq-test-visible-response 0b9189da830f7da83b392d04564f95c0959d1938
          release/mimo-v2 336e69000d634224c3efc8028cac0727cc6eb622
          CLEANUP_BRANCHES
          if [[ "$failures" -ne 0 ]]; then
            echo "::error::$failures branches were not deleted"
            exit 1
          fi
