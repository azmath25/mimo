name: One-time verified merged PR branch cleanup (mimo)
on:
  push:
    branches: [main]
    paths: ['.github/workflows/one-time-branch-cleanup.yml']
permissions:
  contents: write
  pull-requests: read
jobs:
  prune:
    if: github.repository == 'azmath25/mimo'
    runs-on: ubuntu-latest
    steps:
      - name: Remove SHA-pinned merged PR branches with zero unique work
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          open_refs=$(gh api "repos/$GITHUB_REPOSITORY/pulls?state=open&per_page=100" --paginate --jq '.[].head.ref, .[].base.ref')
          merged_heads=$(gh api "repos/$GITHUB_REPOSITORY/pulls?state=closed&per_page=100" --paginate --jq '.[] | select(.merged_at != null) | [.head.ref, .head.sha] | @tsv')
          failures=0
          deleted=0
          while read -r branch expected; do
            [[ -z "$branch" ]] && continue
            case "$branch" in main|main-backup|work/*|backup/*) echo "PROTECTED $branch"; exit 1;; esac
            if grep -Fxq "$branch" <<< "$open_refs"; then echo "SKIP OPEN PR $branch"; continue; fi
            current=$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/$branch" --jq '.object.sha' 2>/dev/null || true)
            if [[ -z "$current" ]]; then echo "SKIP ABSENT $branch"; continue; fi
            if [[ "$current" != "$expected" ]]; then echo "SKIP MOVED $branch"; failures=$((failures+1)); continue; fi
            ahead=$(gh api "repos/$GITHUB_REPOSITORY/compare/main...$branch" --jq '.ahead_by' 2>/dev/null || true)
            matched=$(printf '%s\t%s' "$branch" "$expected")
            if [[ "$ahead" != "0" ]] && ! grep -Fxq "$matched" <<< "$merged_heads"; then
              echo "SKIP UNIQUE UNMERGED COMMITS $branch"; failures=$((failures+1)); continue
            fi
            if gh api -X DELETE "repos/$GITHUB_REPOSITORY/git/refs/heads/$branch" >/dev/null; then
              echo "DELETED $branch"; deleted=$((deleted+1))
            else echo "FAILED $branch"; failures=$((failures+1)); fi
          done <<'VERIFIED_BRANCHES'
          feature/fe-live-backend-20261104 19c0abb8ab46246f5b6590bba4ce887f5d19d879
          feature/m-api-orchestration-20261105 71fb36df8885ef3afc6716a6c5b7dca7e4acd16b
          feature/tikz-png-dpi-20261105 8746be5180096a8f54766e9d9fba54201245f074
          fix/mimo-model-price-entry-20261106 41f92c5f639e9361add9471bc9863afede0efc4c
          fix/studio-supported-tools-only-20261105 38d50cc3c5c10918fa8399dd2bfc179b5349e863
          fix/tikz-verify-actual-png-dpi-20261105 c1421e6a4be94728019ed12ed677cbe80111e927
          fix/tikz-visible-dpi-panel-20261105 cf7430a85897a14886b2cc1e8f2f94146fb681bc
          ui/studio-canvas-first 8e68fa1120a8ae822e12405b1b13574b63b80147
          VERIFIED_BRANCHES
          echo "Deleted $deleted of 8 selected branches; failures=$failures"
          test "$failures" -eq 0
