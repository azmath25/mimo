name: Mimo frontend checks

on:
  push:
    branches: [main, 'feature/**', 'release/**']
  pull_request:
    branches: [main]

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Syntax-check all site modules
        run: |
          for script in api-request.js rest-connections.js connectors.js cloud-auth.js cloud-bridge.js cloud-results.js site.js studio-run-options.js overview.js workflows.js models.js access.js budgets.js files.js runs.js tikz.js ops-diagnostics.js diagnostics.js; do node --check "$script"; done
      - name: Run adapter and studio smoke tests
        run: node --test tests/*.test.cjs

      - name: Install isolated browser test dependency
        run: npm install --no-save --no-package-lock --no-audit --no-fund playwright-core@1.56.1
      - name: Local-only Chromium viewport and keyboard checks
        run: |
          command -v google-chrome || command -v chromium
          node --test browser-tests/mfe4.browser.cjs
      - name: Preserve synthetic browser screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mimo-local-browser-photos
          path: test-artifacts/mfe4/
          if-no-files-found: ignore
          retention-days: 7
