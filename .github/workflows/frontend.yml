name: Mimo frontend checks

on:
  push:
    branches: [main, 'feature/**']
  pull_request:
    branches: [main]

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Syntax-check all site modules
        run: |
          for script in cloud-auth.js cloud-bridge.js cloud-results.js site.js overview.js workflows.js models.js access.js budgets.js files.js runs.js tikz.js; do node --check "$script"; done
      - name: Run adapter and studio smoke tests
        run: node --test tests/*.test.cjs
