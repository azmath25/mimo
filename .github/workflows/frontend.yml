name: Mimo frontend checks

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Syntax-check Firebase module
        run: node --check cloud-auth.js
      - name: Run adapter and studio smoke tests
        run: node --test tests/*.test.cjs
